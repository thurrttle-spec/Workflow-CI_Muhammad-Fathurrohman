name: BISINDO Classification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # trigger manual dari GitHub UI

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.17.2 \
                      numpy==2.1.3 \
                      pandas==2.2.3 \
                      scikit-learn==1.5.2 \
                      scipy==1.14.1 \
                      matplotlib==3.9.4 \
                      seaborn==0.13.2 \
                      opencv-python-headless==4.10.0.84 \
                      scikit-image==0.24.0 \
                      Pillow==11.0.0 \
                      joblib==1.4.2

      # ── 4. Jalankan MLflow Project ────────────────────────────────
      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          python modelling.py \
            --n_estimators 200 \
            --max_depth None \
            --min_samples_split 5 \
            --max_features sqrt \
            --test_size 0.2 \
            --random_state 42

      # ── 5. Upload artefak ke GitHub Actions ───────────────────────
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: bisindo-model-artifacts
          path: |
            MLProject/artifacts/
            MLProject/mlruns/
          retention-days: 30

      # ── 6. Upload model.pkl ke GitHub Release (opsional) ─────────
      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find MLProject/artifacts -type f 2>/dev/null || echo "No artifacts found"
          echo "=== MLruns ==="
          find MLProject/mlruns -type f 2>/dev/null | head -20 || echo "No mlruns found"
