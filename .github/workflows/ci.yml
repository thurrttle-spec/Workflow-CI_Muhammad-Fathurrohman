name: BISINDO Classification CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install mlflow==2.17.2 numpy==2.1.3 pandas==2.2.3 scikit-learn==1.5.2 scipy==1.14.1 matplotlib==3.9.4 seaborn==0.13.2 opencv-python-headless==4.10.0.84 scikit-image==0.24.0 Pillow==11.0.0 joblib==1.4.2

      - name: Run MLflow Project
        run: python MLProject/run_training.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bisindo-model-artifacts
          path: MLProject/artifacts/
          retention-days: 30
